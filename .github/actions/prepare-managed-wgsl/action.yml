name: Restore released managed WGSL dependency
description: Restore the public compiler package; no Copeland checkout or private feed is required.
runs:
  using: composite
  steps:
    - name: Restore public managed compiler
      shell: pwsh
      run: |
        $env:MSBUILDDISABLENODEREUSE = '1'
        dotnet restore Aetheris.Kernel.Firmament/Aetheris.Kernel.Firmament.csproj -m:1 -nr:false --source https://api.nuget.org/v3/index.json
        if ($LASTEXITCODE -ne 0) { throw 'Public compiler dependency restore failed.' }

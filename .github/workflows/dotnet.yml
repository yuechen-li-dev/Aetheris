name: dotnet

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified release candidate
        type: boolean
        default: false
      diagnostic_run_id:
        description: Diagnose an existing release artifact without rebuilding it (empty runs full qualification)
        type: string
        default: ''
      qualification_run_id:
        description: Requalify immutable artifacts from a producer with both full regression lanes passed (empty rebuilds)
        type: string
        default: ''

env:
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build-test:
    if: ${{ !inputs.diagnostic_run_id && !inputs.qualification_run_id }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository information architecture
        shell: pwsh
        run: ./scripts/Test-RepositoryLayout.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node for pinned drawing browser assets
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare managed WGSL dependency
        uses: ./.github/actions/prepare-managed-wgsl

      - name: Restore server
        run: dotnet restore Aetheris.Server/Aetheris.Server.csproj

      - name: Restore kernel tests
        run: dotnet restore Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj

      - name: Build server
        run: dotnet build Aetheris.Server/Aetheris.Server.csproj --configuration Release --no-restore

      - name: Build kernel tests
        run: dotnet build Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj --configuration Release --no-restore

      - name: Test kernel
        run: dotnet test Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj --configuration Release --no-build --filter "Category!=SlowCorpus"

      - name: Restore solution
        run: dotnet restore Aetheris.slnx

      - name: Build solution
        run: dotnet build Aetheris.slnx --configuration Release --no-restore -m:1

      - name: Install optional PDF renderer for interoperability tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test full solution
        env:
          AETHERIS_TEST_PDFTOPPM: /usr/bin/pdftoppm
        run: dotnet test Aetheris.slnx --configuration Release --no-build -m:1 -- RunConfiguration.MaxCpuCount=1 xUnit.ParallelizeTestCollections=false

      - name: Qualify portable CLI package
        shell: pwsh
        run: |
          dotnet pack Aetheris.CLI -c Release --no-build -m:1 -nr:false -o artifacts/local/portable-cli
          if ($LASTEXITCODE -ne 0) { throw 'CLI pack failed' }
          $packages = @(Get-ChildItem artifacts/local/portable-cli/Aetheris.CLI.*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one core CLI package' }
          ./scripts/Test-CoreCliPayload.ps1 -PackagePath $packages[0].FullName

  release-build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    if: ${{ !inputs.diagnostic_run_id && !inputs.qualification_run_id && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/tspack
          ref: 01051b791cf83757a1c419ef7bc276d9de787a9d # scoped tools, local dependencies and explicit shared runtime providers
          path: artifacts/local/release-tools/tspack
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: artifacts/local/release-tools/tspack/go.mod
          cache-dependency-path: artifacts/local/release-tools/tspack/go.sum
      - name: Build pinned TSPack
        shell: pwsh
        run: |
          $source = Resolve-Path 'artifacts/local/release-tools/tspack'
          Push-Location "$source/manifest-frontend"
          try {
            npm install --no-package-lock
            if ($LASTEXITCODE -ne 0) { throw 'TSPack manifest frontend dependency installation failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'TSPack manifest frontend build failed.' }
          }
          finally { Pop-Location }

          Push-Location $source
          try {
            go run ./tools/generate-embedded-bridges
            if ($LASTEXITCODE -ne 0) { throw 'TSPack embedded bridge generation failed.' }
            New-Item -ItemType Directory -Force dist | Out-Null
            go build -trimpath -buildvcs=false -tags tspack_embedded_bridges `
              -ldflags '-X github.com/yuechen-li-dev/tspack/internal/version.Version=v0.1.14-m80i.2+01051b791cf8 -X github.com/yuechen-li-dev/tspack/internal/version.Commit=01051b791cf8 -X github.com/yuechen-li-dev/tspack/internal/version.Date=2026-10-24T17:54:42Z' `
              -o dist/tspack.exe ./cmd/tspack
            if ($LASTEXITCODE -ne 0) { throw 'Pinned TSPack build failed.' }
          }
          finally { Pop-Location }

          $toolDirectory = "$source/dist"
          $toolDirectory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$toolDirectory/tspack.exe" --version
      - name: Prepare managed WGSL dependency
        uses: ./.github/actions/prepare-managed-wgsl
      - name: Qualify clean Cadmata frontend
        shell: pwsh
        run: ./scripts/Build-CadmataFrontend.ps1
      - name: Restore and build the release candidate
        run: |
          dotnet restore Aetheris.slnx
          dotnet build Aetheris.slnx --no-restore /m:1 -c Release
      - name: Test the release candidate
        run: dotnet test Aetheris.slnx -c Release --no-build -m:1 -- RunConfiguration.MaxCpuCount=1 xUnit.ParallelizeTestCollections=false
      - name: Package exact release bytes
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and source version disagree.' }
          ./scripts/package-release.ps1 -Version $version -OutputDirectory artifacts/release/published
          ./scripts/package-public-libraries.ps1 -Version $version -OutputDirectory artifacts/release/public-libraries
          ./scripts/finalize-publication.ps1 -ReleaseDirectory artifacts/release/published -PublicLibrariesDirectory artifacts/release/public-libraries
      - uses: actions/upload-artifact@v4
        with:
          name: aetheris-release
          path: artifacts/release/published
          if-no-files-found: error

  release-smoke:
    needs: release-build
    if: ${{ always() && !inputs.diagnostic_run_id && (needs.release-build.result == 'success' || inputs.qualification_run_id != '') }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify producer identity and regression gates
        id: producer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ inputs.qualification_run_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $source = $env:GITHUB_SHA
          if ($env:QUALIFIED_RUN) {
            if ($env:QUALIFIED_RUN -notmatch '^\d+$') { throw 'Producer run ID must contain only digits' }
            $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALIFIED_RUN" --jq .head_sha
            $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALIFIED_RUN/jobs?per_page=100" | ConvertFrom-Json
            foreach ($name in @('build-test', 'release-build')) {
              if (-not ($jobs.jobs | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' })) {
                throw "Producer must pass $name before artifact requalification"
              }
            }
          }
          "revision=$source" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: aetheris-release
          path: release
          run-id: ${{ inputs.qualification_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Read version from the actual CLI package
        id: artifact
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem release/packages/Aetheris.CLI.*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one staged CLI package' }
          $zip = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $manifest = @($zip.Entries | Where-Object FullName -Like '*.nuspec')
            if ($manifest.Count -ne 1) { throw 'Expected one CLI package manifest' }
            $reader = [IO.StreamReader]::new($manifest[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            "version=$($nuspec.package.metadata.version)" >> $env:GITHUB_OUTPUT
          }
          finally { $zip.Dispose() }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Clean-directory Windows bundle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem release/Aetheris-*-win-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName extracted
          $metadata = Get-Content extracted/Aetheris-win-x64/BUILD-METADATA.json -Raw | ConvertFrom-Json
          if ($metadata.sourceRevision -ne '${{ steps.producer.outputs.revision }}') { throw 'Artifact and producer source identity disagree' }
          $cli = (Resolve-Path extracted/Aetheris-win-x64/aetheris.exe)
          & $cli --version
          & $cli --help
          Copy-Item '${{ github.workspace }}/fixtures/Canonical/Features/Holes/through-hole.firmament' smoke.firmament
          & $cli validate smoke.firmament
          & $cli build smoke.firmament
          & $cli inspect smoke.firmament
          & $cli verify smoke.firmament
          ./scripts/Test-CadmataBundle.ps1 -BundleDirectory extracted/Aetheris-win-x64 -StepPath smoke.step -OutputDirectory artifacts/local/cadmata-bundle-smoke
          $forge = (Resolve-Path extracted/Aetheris-win-x64/forge-host/Aetheris.Forge.Host.exe)
          & $forge info
          & $forge list
          ./scripts/Test-ForgeHostTemplates.ps1 -ExecutablePath $forge -OutputDirectory artifacts/local/native-forge-templates
          & $forge invoke Standard.SheetMetal.ElectronicsEnclosure --request extracted/Aetheris-win-x64/samples/forge-interop-x1/request.json --out forge-out
          if (-not (Test-Path forge-out/*.step) -or -not (Test-Path forge-out/*.svg)) { throw 'NativeAOT Forge artifacts missing.' }
          Copy-Item '${{ github.workspace }}/fixtures/Regression/Assembly/bearing-module-family-with-legacy-placement.firmament' assembly.firmament
          & $cli asm inspect assembly.firmament --json
          Copy-Item '${{ github.workspace }}/fixtures/Canonical/Drawings/bearing-block-production-drawing.firmament' drawing.firmament
          & $cli drawing compile drawing.firmament --out-dir drawing-out --json
          if (-not (Test-Path drawing-out/*.pdf) -or -not (Test-Path drawing-out/*.pptx)) { throw 'Drawing PDF/PPTX smoke outputs missing.' }
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - name: Launch the actual extracted desktop with no arguments
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CADMATA_QUALIFICATION_LAUNCH_ONLY: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix test-support/CadmataDesktopSmoke --ignore-scripts
          node scripts/qualify-cadmata-portable.mts extracted/Aetheris-win-x64 artifacts/local/desktop-no-argument-smoke test-support/CadmataDesktopSmoke/node_modules/playwright-core/index.mjs smoke.step
      - name: Install and exercise the portable tool
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item fixtures/Canonical/Features/Holes/through-hole.firmament tool-smoke.firmament
          $package = Get-ChildItem release/packages/*.nupkg | Select-Object -First 1
          New-Item -ItemType Directory local-feed, installed-tool | Out-Null
          Copy-Item $package.FullName local-feed
          dotnet tool install --tool-path installed-tool Aetheris.CLI --version ${{ steps.artifact.outputs.version }} --add-source local-feed --ignore-failed-sources
          & installed-tool/aetheris --version
          & installed-tool/aetheris validate tool-smoke.firmament --json
          & installed-tool/aetheris build tool-smoke.firmament --out tool-smoke.step --json
          & installed-tool/aetheris verify tool-smoke.firmament --json
      - name: Verify checksums and public packages
        shell: pwsh
        env:
          AETHERIS_RELEASE_VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $path = Join-Path (Resolve-Path release) $Matches[2]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          ./scripts/Test-PublicPackageGraph.ps1 -PackageDirectory release/packages/public-libraries -Version $env:AETHERIS_RELEASE_VERSION
          ./scripts/Test-PublicPackageConsumer.ps1 -PackageDirectory release/packages/public-libraries -Version $env:AETHERIS_RELEASE_VERSION -OutputDirectory artifacts/local/release-public-consumer
      - name: Preserve native desktop qualification evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qualification-evidence
          path: artifacts/local/desktop-no-argument-smoke
          if-no-files-found: ignore

  publish:
    if: ${{ !inputs.diagnostic_run_id && !inputs.qualification_run_id && (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) }}
    needs: [build-test, release-build, release-smoke]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aetheris-release
          path: release
      - name: Authenticate to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: yuechen-li
      - name: Publish the tested NuGet packages
        shell: pwsh
        run: |
          Get-Content release/packages/public-libraries/PACKAGE_ORDER.txt | ForEach-Object {
            $package = "release/packages/public-libraries/$_.${{ needs.release-build.outputs.version }}.nupkg"
            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $_" }
          }
          dotnet nuget push 'release/packages/Aetheris.CLI.${{ needs.release-build.outputs.version }}.nupkg' --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet push failed for Aetheris.CLI.' }
      - name: Create release and upload the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --repo "${GITHUB_REPOSITORY}" --title "Aetheris ${RELEASE_VERSION}" --latest --notes-file docs/release/${{ needs.release-build.outputs.version }}-notes.md release/Aetheris-*.zip release/aetheris-firmament-*.vsix release/SHA256SUMS.txt release/RELEASE-INVENTORY.md release/packages/*.nupkg release/packages/public-libraries/*.nupkg || \
          gh release upload "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --clobber release/Aetheris-*.zip release/aetheris-firmament-*.vsix release/SHA256SUMS.txt release/RELEASE-INVENTORY.md release/packages/*.nupkg release/packages/public-libraries/*.nupkg
          gh release edit "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --latest --prerelease=false --notes-file docs/release/${{ needs.release-build.outputs.version }}-notes.md

  desktop-diagnostic:
    if: ${{ inputs.diagnostic_run_id != '' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/cadmata-desktop-diagnostic.yml
    with:
      run_id: ${{ inputs.diagnostic_run_id }}

name: dotnet

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository information architecture
        shell: pwsh
        run: ./scripts/Test-RepositoryLayout.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore server
        run: dotnet restore Aetheris.Server/Aetheris.Server.csproj

      - name: Restore kernel tests
        run: dotnet restore Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj

      - name: Build server
        run: dotnet build Aetheris.Server/Aetheris.Server.csproj --configuration Release --no-restore

      - name: Build kernel tests
        run: dotnet build Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj --configuration Release --no-restore

      - name: Test kernel
        run: dotnet test Aetheris.Kernel.Core.Tests/Aetheris.Kernel.Core.Tests.csproj --configuration Release --no-build --filter "Category!=SlowCorpus"

  public-library-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack public library dependency graph
        shell: pwsh
        run: ./scripts/package-public-libraries.ps1 -OutputDirectory artifacts/packages/public-libraries
      - uses: actions/upload-artifact@v4
        with:
          name: public-libraries-preview3
          path: artifacts/packages/public-libraries
          if-no-files-found: error

  public-library-smoke:
    needs: public-library-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: public-libraries-preview3
          path: local-feed
      - name: Restore and run clean public-package consumer
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'aetheris-public-package-smoke'
          $packages = Join-Path $env:RUNNER_TEMP 'aetheris-public-package-cache'
          $nugetConfigDirectory = Join-Path $env:RUNNER_TEMP 'aetheris-public-package-nuget'
          Copy-Item test-support/PublicPackageSmoke $smoke -Recurse
          dotnet new nugetconfig --output $nugetConfigDirectory --force
          dotnet nuget add source "$pwd/local-feed" --name aetheris-local --configfile "$nugetConfigDirectory/NuGet.Config"
          dotnet restore "$smoke/PublicPackageSmoke.csproj" --configfile "$nugetConfigDirectory/NuGet.Config" --packages $packages --no-cache
          dotnet run --project "$smoke/PublicPackageSmoke.csproj" --configuration Release --no-restore --property:RestorePackagesPath=$packages

  publish-public-libraries:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: [build-test, public-library-smoke]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-libraries-preview3
          path: packages
      - name: Authenticate to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: yuechen-li
      - name: Publish tested packages in dependency order
        shell: pwsh
        run: |
          Get-Content packages/PACKAGE_ORDER.txt | ForEach-Object {
            $package = "packages/$_.2.0.0-preview.3.nupkg"
            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $_" }
          }

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/tspack
          ref: 359b0738acda3d6d4d05c3775763a5e63236273c
          path: .release-tools/tspack
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .release-tools/tspack/go.mod
          cache-dependency-path: .release-tools/tspack/go.sum
      - name: Build pinned TSPack
        shell: pwsh
        run: |
          $source = Resolve-Path '.release-tools/tspack'
          Push-Location "$source/manifest-frontend"
          try {
            npm install --no-package-lock
            if ($LASTEXITCODE -ne 0) { throw 'TSPack manifest frontend dependency installation failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'TSPack manifest frontend build failed.' }
          }
          finally { Pop-Location }

          Push-Location $source
          try {
            go run ./tools/generate-embedded-bridges
            if ($LASTEXITCODE -ne 0) { throw 'TSPack embedded bridge generation failed.' }
            New-Item -ItemType Directory -Force dist | Out-Null
            go build -trimpath -buildvcs=false -tags tspack_embedded_bridges `
              -ldflags '-X github.com/yuechen-li-dev/tspack/internal/version.Version=v0.1.8-pinned.359b073 -X github.com/yuechen-li-dev/tspack/internal/version.Commit=359b0738acda -X github.com/yuechen-li-dev/tspack/internal/version.Date=2026-08-08T23:18:29Z' `
              -o dist/tspack.exe ./cmd/tspack
            if ($LASTEXITCODE -ne 0) { throw 'Pinned TSPack build failed.' }
          }
          finally { Pop-Location }

          $toolDirectory = "$source/dist"
          $toolDirectory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$toolDirectory/tspack.exe" --version
      - name: Restore and build Preview 3 frozen baseline
        run: |
          dotnet restore Aetheris.slnx
          dotnet build Aetheris.slnx --no-restore /m:1 -c Release
      - name: Test frozen baseline
        run: dotnet test Aetheris.slnx -c Release --no-build -m:1 -- RunConfiguration.MaxCpuCount=1
      - name: Package exact release bytes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/package-release.ps1 -Version $version -OutputDirectory artifacts/release/published
          ./scripts/package-public-libraries.ps1 -Version $version -OutputDirectory artifacts/release/public-libraries
          ./scripts/finalize-publication.ps1 -ReleaseDirectory artifacts/release/published -PublicLibrariesDirectory artifacts/release/public-libraries
      - uses: actions/upload-artifact@v4
        with:
          name: preview3-release
          path: artifacts/release/published
          if-no-files-found: error

  release-smoke:
    needs: release-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview3-release
          path: release
      - name: Clean-directory CLI and package smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/Aetheris-*-win-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName extracted
          $cli = (Resolve-Path extracted/Aetheris-win-x64/aetheris.exe)
          & $cli --version
          & $cli --help
          Copy-Item '${{ github.workspace }}/fixtures/Canonical/Features/Holes/through-hole.firmament' smoke.firmament
          & $cli validate smoke.firmament
          & $cli build smoke.firmament
          & $cli inspect smoke.firmament
          & $cli verify smoke.firmament
          Copy-Item '${{ github.workspace }}/fixtures/Regression/Assembly/bearing-module-family-with-legacy-placement.firmament' assembly.firmament
          & $cli asm inspect assembly.firmament --json
          Copy-Item '${{ github.workspace }}/fixtures/Canonical/Drawings/bearing-block-production-drawing.firmament' drawing.firmament
          & $cli drawing compile drawing.firmament --out-dir drawing-out --json
          if (-not (Test-Path drawing-out/*.pdf) -or -not (Test-Path drawing-out/*.pptx)) { throw 'Drawing PDF/PPTX smoke outputs missing.' }
          $package = Get-ChildItem release/packages/*.nupkg | Select-Object -First 1
          New-Item -ItemType Directory local-feed, installed-tool | Out-Null
          Copy-Item $package.FullName local-feed
          dotnet tool install --tool-path installed-tool Aetheris.CLI --version 2.0.0-preview.3 --add-source local-feed --ignore-failed-sources
          & installed-tool/aetheris --version
          & installed-tool/aetheris build smoke.firmament
      - name: Verify checksums and public packages
        shell: pwsh
        run: |
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $path = Join-Path (Resolve-Path release) $Matches[2]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          $smoke = Join-Path $env:RUNNER_TEMP 'aetheris-preview3-public-package-smoke'
          $packages = Join-Path $env:RUNNER_TEMP 'aetheris-preview3-public-package-cache'
          $nugetConfigDirectory = Join-Path $env:RUNNER_TEMP 'aetheris-preview3-public-package-nuget'
          Copy-Item test-support/PublicPackageSmoke $smoke -Recurse
          dotnet new nugetconfig --output $nugetConfigDirectory --force
          dotnet nuget add source "$pwd/release/packages/public-libraries" --name aetheris-local --configfile "$nugetConfigDirectory/NuGet.Config"
          dotnet restore "$smoke/PublicPackageSmoke.csproj" --configfile "$nugetConfigDirectory/NuGet.Config" --packages $packages --no-cache
          dotnet run --project "$smoke/PublicPackageSmoke.csproj" --configuration Release --no-restore --property:RestorePackagesPath=$packages

  publish:
    needs: release-smoke
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview3-release
          path: release
      - name: Authenticate to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: yuechen-li
      - name: Publish the tested NuGet packages
        shell: pwsh
        run: |
          dotnet nuget push 'release/packages/Aetheris.CLI.2.0.0-preview.3.nupkg' --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet push failed for Aetheris.CLI.' }
          Get-Content release/packages/public-libraries/PACKAGE_ORDER.txt | ForEach-Object {
            $package = "release/packages/public-libraries/$_.2.0.0-preview.3.nupkg"
            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $_" }
          }
      - name: Create release and upload the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Aetheris ${GITHUB_REF_NAME#v}" --latest --notes-file docs/release/2.0.0-preview.3-notes.md release/Aetheris-*.zip release/aetheris-firmament-*.vsix release/SHA256SUMS.txt release/RELEASE-INVENTORY.md release/packages/*.nupkg release/packages/public-libraries/*.nupkg || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber release/Aetheris-*.zip release/aetheris-firmament-*.vsix release/SHA256SUMS.txt release/RELEASE-INVENTORY.md release/packages/*.nupkg release/packages/public-libraries/*.nupkg
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --latest --prerelease=false --notes-file docs/release/2.0.0-preview.3-notes.md
